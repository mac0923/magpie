<main><h1>#1233 界面预览</h1><p class="m">commit 75a2869 · <a href="https://github.com/yetone/magpie/pull/1233">回到 PR</a> · Agents 列表里新增了 omp 的命名配置档行：~/.omp/profiles 下每个合法配置档都是独立 Agent（Windows 上是「omp · &lt;名称&gt;」，WSL 里是「omp · &lt;名称&gt; · WSL &lt;发行版&gt;」），各自拥有模型、task、smol/slow、thinking 等设置与接入状态、断开；同时 app.js 对 API 路径段做了 URL 编码，避免 omp#work 在 # 处被截断而写错行。</p>
